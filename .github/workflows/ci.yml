name: CI

on:
  push:
    branches: [main, master, cnn-classification]
  pull_request:
    branches: [main, master, cnn-classification]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI tools
        run: python -m pip install --upgrade pip ruff pytest

      - name: Run Ruff checks
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Run tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: quality-and-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config -q

      - name: Build CNN validation image
        run: docker build --tag zerowaste-cnn-dataset-validator:ci .

      - name: Validate CNN Compose services
        run: docker compose config -q
