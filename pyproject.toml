[tool.poetry]
name = "zero-waste-smart-recycle"
version = "0.1.0"
description = "ResNet50-based smart waste classification and recycling management system"
authors = ["Seher Ugurlu", "Damla Su Ozbek"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
torch = "^2.5.0"
torchvision = "^0.20.0"
Pillow = "^10.4.0"
PyYAML = "^6.0.2"
scikit-learn = "^1.5.0"
numpy = "^1.26.0"
dvc = {version = "^3.67.1", extras = ["gdrive"]}

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.6.0"
pre-commit = "^3.7.0"
dvc = "^3.67.1"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
